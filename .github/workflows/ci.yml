name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop-homeui2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Dependency-free preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MOGURIA_GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false
      - name: Install image validation system package
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends imagemagick
      - name: Run canonical validation and tests
        run: npm run ci
